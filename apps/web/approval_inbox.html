<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Approval inbox</title>
    <link rel="stylesheet" href="/auth/assets/approval_inbox.css">
    <script src="/auth/assets/auth.js" defer></script>
    <script src="/auth/assets/approval_inbox.js" defer></script>
  </head>
  <body>
    <main>
      <header>
        <h1>Approval inbox</h1>
        <p class="lede">Inspect each claim, commit, verification result, evidence, and cost before recording a decision. Decisions never publish from this page.</p>
        <div class="access">
          <span id="reviewer-name">Sign in to view your repositories.</span>
          <a id="github-login" href="/auth/login">Sign in with GitHub</a>
          <button id="logout" type="button" hidden>Sign out</button>
          <button class="load" id="load" type="button">Load findings</button>
        </div>
        <div id="notice" role="status" aria-live="polite"></div>
      </header>
      <section id="findings" aria-label="Findings"></section>
    </main>

  </body>
</html>
