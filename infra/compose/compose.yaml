name: pr-reliability-platform

x-app: &app
  build:
    context: ../..
    dockerfile: infra/compose/Dockerfile
  image: pr-reliability-platform:local
  restart: unless-stopped

services:
  migrate:
    <<: *app
    restart: "no"
    command: [python, -m, pr_reliability_api.migrate]
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}

  api:
    <<: *app
    command:
      - uvicorn
      - --no-access-log
      - --factory
      - pr_reliability_api.app:create_app_from_environment
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      EVIDENCE_ENCRYPTION_KEY: ${EVIDENCE_ENCRYPTION_KEY:?EVIDENCE_ENCRYPTION_KEY is required}
      EVIDENCE_MAX_BYTES: ${EVIDENCE_MAX_BYTES:-262144}
      EVIDENCE_RETENTION_SECONDS: ${EVIDENCE_RETENTION_SECONDS:-604800}
      EVIDENCE_SECRET_PATTERNS: ${EVIDENCE_SECRET_PATTERNS:-[]}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:?GITHUB_OAUTH_CLIENT_ID is required}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:?GITHUB_OAUTH_CLIENT_SECRET is required}
      SESSION_ENCRYPTION_KEY: ${SESSION_ENCRYPTION_KEY:?SESSION_ENCRYPTION_KEY is required}
      GITHUB_LOGIN_ORIGIN: ${GITHUB_LOGIN_ORIGIN:?GITHUB_LOGIN_ORIGIN is required}
      GITHUB_ALLOWED_ACCOUNT_ID: ${GITHUB_ALLOWED_ACCOUNT_ID:?GITHUB_ALLOWED_ACCOUNT_ID is required}
      GITHUB_ADMIN_IDS: ${GITHUB_ADMIN_IDS:?GITHUB_ADMIN_IDS is required}
      GITHUB_REVIEWER_IDS: ${GITHUB_REVIEWER_IDS:-}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      GITHUB_APP_ID: ${GITHUB_APP_ID:?GITHUB_APP_ID is required}
      GITHUB_INSTALLATION_ID: ${GITHUB_INSTALLATION_ID:?GITHUB_INSTALLATION_ID is required}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:?GITHUB_WEBHOOK_SECRET is required}
      HEALTH_CHECK_TIMEOUT_SECONDS: ${HEALTH_CHECK_TIMEOUT_SECONDS:-2}
      OWNER_ID: ${OWNER_ID:?OWNER_ID is required}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:?TEMPORAL_ADDRESS is required}
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-pr-review}
    ports:
      - "${API_PORT:-8000}:8000"

  repository-sync:
    <<: *app
    command: [pr-reliability-repository-sync]
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      OWNER_ID: ${OWNER_ID:?OWNER_ID is required}
      GITHUB_APP_ID: ${GITHUB_APP_ID:?GITHUB_APP_ID is required}
      GITHUB_INSTALLATION_ID: ${GITHUB_INSTALLATION_ID:?GITHUB_INSTALLATION_ID is required}
      GITHUB_PRIVATE_KEY_PATH: /run/secrets/github_private_key
    volumes:
      - ${GITHUB_PRIVATE_KEY_PATH:?GITHUB_PRIVATE_KEY_PATH is required}:/run/secrets/github_private_key:ro

  command-dispatcher:
    <<: *app
    command:
      - pr-reliability-command-dispatcher
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:?TEMPORAL_ADDRESS is required}
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-pr-review}

  workflow-worker:
    <<: *app
    command:
      - pr-reliability-workflow-worker
    stop_grace_period: 90s
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      OWNER_ID: ${OWNER_ID:?OWNER_ID is required}
      RUNNER_ID: ${WORKFLOW_RUNNER_ID:-workflow-1}
      RUNNER_VERSION: ${RUNNER_VERSION:?RUNNER_VERSION is required}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:?TEMPORAL_ADDRESS is required}
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-pr-review}

  activity-worker:
    image: ${ACTIVITY_WORKER_IMAGE:?ACTIVITY_WORKER_IMAGE is required}
    restart: unless-stopped
    stop_grace_period: 90s
    command:
      - pr-reliability-activity-worker
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      EVIDENCE_ENCRYPTION_KEY: ${EVIDENCE_ENCRYPTION_KEY:?EVIDENCE_ENCRYPTION_KEY is required}
      EVIDENCE_MAX_BYTES: ${EVIDENCE_MAX_BYTES:-262144}
      EVIDENCE_RETENTION_SECONDS: ${EVIDENCE_RETENTION_SECONDS:-604800}
      EVIDENCE_SECRET_PATTERNS: ${EVIDENCE_SECRET_PATTERNS:-[]}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      OWNER_ID: ${OWNER_ID:?OWNER_ID is required}
      RUNNER_ID: ${ACTIVITY_RUNNER_ID:-review-1}
      RUNNER_VERSION: ${RUNNER_VERSION:?RUNNER_VERSION is required}
      RUNNER_CAPACITY: ${RUNNER_CAPACITY:-4}
      DASHBOARD_BASE_URL: ${DASHBOARD_BASE_URL:?DASHBOARD_BASE_URL is required}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      REVIEW_ACTIVITY_OPERATIONS_FACTORY: ${REVIEW_ACTIVITY_OPERATIONS_FACTORY:?REVIEW_ACTIVITY_OPERATIONS_FACTORY is required}
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:?TEMPORAL_ADDRESS is required}
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-pr-review}

  operations-monitor:
    <<: *app
    command: [pr-reliability-operation-alerts, --config, /run/operations/config.json]
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      OWNER_ID: ${OWNER_ID:?OWNER_ID is required}
      OPERATIONS_ALERT_TOKEN_FILE: /run/operations/token
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ${OPERATIONS_ALERT_CONFIG_FILE:?OPERATIONS_ALERT_CONFIG_FILE is required}:/run/operations/config.json:ro
      - ${OPERATIONS_ALERT_TOKEN_FILE:?OPERATIONS_ALERT_TOKEN_FILE is required}:/run/operations/token:ro
      - ${OPERATIONS_DISK_PATH:?OPERATIONS_DISK_PATH is required}:/probes/disk:ro
      - ${OPERATIONS_BACKUP_RECEIPT_DIRECTORY:?OPERATIONS_BACKUP_RECEIPT_DIRECTORY is required}:/probes/backup:ro
      - ${TLS_CERTIFICATE_FILE:?TLS_CERTIFICATE_FILE is required}:/probes/tls.pem:ro

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.133.0@sha256:98274b756324abdb2473fa0c898247a246091e861e61d1548f9be483198eecea
    restart: unless-stopped
    command:
      - --config=/etc/otelcol-contrib/config.yaml
    volumes:
      - ../observability/collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "${OTEL_METRICS_PORT:-8889}:8889"
      - "${OTEL_HEALTH_PORT:-13133}:13133"

  prometheus:
    image: ${PROMETHEUS_IMAGE:?PROMETHEUS_IMAGE is required}
    restart: unless-stopped
    command: [--config.file=/etc/prometheus/prometheus.yaml]
    volumes:
      - ../deployment/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ../deployment/rules.yaml:/etc/prometheus/rules.yaml:ro
    ports: ["127.0.0.1:9090:9090"]
