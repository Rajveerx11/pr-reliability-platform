name: Publish release after signed staging acceptance

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Signed release-build run ID
        required: true
        type: string
      previous_run_id:
        description: Compatible previous signed release-build run ID
        required: true
        type: string
      staging_run_id:
        description: Successful release-staging run ID with signed acceptance
        required: true
        type: string
      authorize_github_release_publication:
        description: Separate explicit human authorization to publish a GitHub release
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: signed-release-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && inputs.authorize_github_release_publication
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: approved-release-publication
    permissions:
      contents: write
      actions: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate public run IDs
        env:
          CANDIDATE_RUN: ${{ inputs.candidate_run_id }}
          PREVIOUS_RUN: ${{ inputs.previous_run_id }}
          STAGING_RUN: ${{ inputs.staging_run_id }}
        run: python -c 'import os; assert all(os.environ[k].isdigit() for k in ("CANDIDATE_RUN", "PREVIOUS_RUN", "STAGING_RUN"))'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed-release-candidate
          path: ${{ runner.temp }}/candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed-release-candidate
          path: ${{ runner.temp }}/previous
          run-id: ${{ inputs.previous_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: staging-acceptance
          path: ${{ runner.temp }}/staging
          run-id: ${{ inputs.staging_run_id }}
          github-token: ${{ github.token }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Fail closed, attach evidence to draft, read back, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ROOT: ${{ runner.temp }}
          E2E_SHA256: ${{ vars.STAGING_E2E_SHA256 }}
        run: >-
          python -m infra.release publish
          --candidate "$ARTIFACT_ROOT/candidate"
          --previous "$ARTIFACT_ROOT/previous"
          --receipt "$ARTIFACT_ROOT/staging/staging.json"
          --e2e-program-sha256 "$E2E_SHA256"
          --authorize-github-release-publication
