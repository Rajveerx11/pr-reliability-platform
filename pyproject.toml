[project]
name = "pr-reliability-platform"
version = "0.1.0"
description = "Approval-first, evidence-backed AI pull request review platform."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.11,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.16",
]

[tool.pytest.ini_options]
pythonpath = [
  "packages/contracts/src",
  "packages/proof_adapter/src",
]
testpaths = [
  "apps/api/tests",
  "workers/tests",
  "packages/contracts/tests",
  "packages/proof_adapter/tests",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages/contracts/src/pr_reliability_contracts"]
