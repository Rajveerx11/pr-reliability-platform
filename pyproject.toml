[project]
name = "pr-reliability-platform"
version = "0.1.0"
description = "Approval-first, evidence-backed AI pull request review platform."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.16",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = [
  "apps/api/tests",
  "workers/tests",
  "packages/contracts/tests",
  "packages/proof_adapter/tests",
  "evals/tests",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint.per-file-ignores]
"evals/golden_prs/tasks/python-money-rounding-008/reference_fix/money.py" = ["I001"]
"evals/golden_prs/tasks/python-timezone-009/**/timestamps.py" = ["FURB162"]

