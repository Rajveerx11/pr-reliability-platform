[project]
name = "pr-reliability-platform"
version = "0.1.0"
description = "Approval-first, evidence-backed AI pull request review platform."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "pydantic>=2.11,<3",
  "psycopg[binary]>=3.2,<4",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8",
  "ruff>=0.16",
]

[tool.pytest.ini_options]
pythonpath = [
  ".",
  "apps/api/src",
  "packages/contracts/src",
  "packages/proof_adapter/src",
]
testpaths = [
  "apps/api/tests",
  "workers/tests",
  "packages/contracts/tests",
  "packages/proof_adapter/tests",
  "evals/tests",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint.per-file-ignores]
"evals/golden_prs/tasks/python-money-rounding-008/reference_fix/money.py" = ["I001"]
"evals/golden_prs/tasks/python-timezone-009/**/timestamps.py" = ["FURB162"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "apps/api/src/pr_reliability_api",
  "packages/contracts/src/pr_reliability_contracts",
]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "pr_reliability_api/_migrations"
